[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdsd"
version = "1.0.0"
description = "Spec-Driven Secure Development (SDSD) CLI & Guardrail Engine"
readme = "README.md"
authors = [{ name = "Harinath Mallepally", email = "harinath@mallepally.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
    "hypothesis>=6.80.0",
]

[project.scripts]
sdsd = "sdsd:main"
