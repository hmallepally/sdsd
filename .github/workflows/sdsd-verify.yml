name: SDSD Autonomous Invariant Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Multi-Language Invariant Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio hypothesis pydantic z3-solver .

      - name: 1. Validate Five-Pillar JSON Schema
        run: |
          python sdsd.py spec validate schemas/aetherfi_transfer.schema.json

      - name: 2. Run Cache Isolation & Anti-Confusion Tests (Ch. 1)
        run: |
          pytest examples/python/ch01_caching_confusion/test_cache.py -v

      - name: 3. Run Concurrent Conservation of Mass Tests (Ch. 2)
        run: |
          pytest examples/python/ch02_bulletproof_spec/test_concurrent_transfers.py -v

      - name: 4. Run Threat Model SQLi & Tenant Isolation Tests (Ch. 3)
        run: |
          pytest examples/python/ch03_threat_modeling/test_threat_mitigation.py -v

      - name: 5. Run Property-Based Fuzzing Tests with Hypothesis (Ch. 10)
        run: |
          pytest examples/python/ch10_testing_methodology/test_property_based.py -v
